# Checks, lints, tests and builds every workspace package on each pull request and push to main, and reports
# the unit and integration test coverage in the run's summary and on the pull request.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancels an older run of the same branch when a newer commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the job post and update the coverage comment on the pull request.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm coverage
      - run: pnpm build
      - run: pnpm --silent coverage:report > coverage-report.md
      - run: cat coverage-report.md >> "$GITHUB_STEP_SUMMARY"
      # Dependabot and forks get a read-only token, so only this repository's own pull requests get the comment.
      - if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        run: gh pr comment "$PR_NUMBER" --body-file coverage-report.md --edit-last --create-if-none
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
